name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install 3.13
      - name: Install deps
        run: uv sync
      - name: Lint
        run: uv run ruff check app tests
      - name: Test
        env:
          LYNKOS_MOCK_MODE: "true"
          LYNKOS_JWT_SECRET: "ci-secret-for-tests-only"
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npx tsc -b --noEmit
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check shell helpers
        run: |
          for f in install.sh dev.sh deploy/lynkos-*; do
            [ -f "$f" ] || continue
            bash -n "$f"
            echo "ok: $f"
          done
